name: Medsos (Instagram + Halaman FB) — pratinjau & posting

# Saat ada artikel BARU ditambahkan ke main (mis. PR auto-draft di-merge),
# siapkan PRATINJAU 1 foto + caption untuk Instagram DAN Halaman Facebook.
# Yang menayangkan adalah POS (Pusat Konten) lewat workflow_dispatch dengan
# input `posting: true`, SETELAH caption & foto ditinjau manusia.
#
# Kenapa harus ditinjau: caption IG TIDAK bisa diedit lewat API setelah tayang
# (CLAUDE.md Bagian 13) — koreksi berarti hapus + posting ulang manual. Blog
# sudah punya gerbang tinjau di POS; medsos dulu tidak, padahal justru medsos
# yang paling sulit dibatalkan.
#
# Hasil pratinjau = asset `preview-<slug>.json` di release `ig-images`, berisi
# caption IG & FB serta URL JPEG 1080x1080 yang persis akan tayang.
# KHUSUS artikel kucing & anjing (SOCIAL_ANIMALS) — kriteria medsos sengaja
# BEDA dari blog, yang tetap memuat semua hewan.
# Pola deteksi artikel baru SAMA dengan notify-new-post.yml (status A = ditambahkan),
# supaya artikel lama yang disunting tidak diposting ulang.
#
# Workflow ini SENGAJA terpisah dari notify-new-post.yml karena butuh
# `contents: write` (mengunggah gambar JPEG sebagai release asset) —
# workflow notifikasi tetap read-only.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
  # Dipicu POS (Pusat Konten) setelah caption & foto DISETUJUI, atau manual utk uji.
  # `posting` = false (default) hanya menghitung ulang pratinjau; true baru menayangkan.
  workflow_dispatch:
    inputs:
      path:
        description: "Path artikel (kosong = artikel terbaru)"
        required: false
        default: ""
      posting:
        description: "true = TAYANGKAN ke IG/FB. false = pratinjau saja"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      aksi:
        description: "Tombol panel POS: pratinjau | tayangkan | tolak (buang dari antrean)"
        required: false
        default: "pratinjau"
        type: choice
        options: ["pratinjau", "tayangkan", "tolak"]
      caption_ig:
        description: "Caption Instagram hasil suntingan (kosong = pakai rakitan skrip)"
        required: false
        default: ""
      caption_fb:
        description: "Caption Facebook hasil suntingan (kosong = pakai rakitan skrip)"
        required: false
        default: ""

permissions:
  contents: write  # perlu untuk membuat/menambah asset di release `ig-images`

jobs:
  instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # perlu histori untuk diff before..after

      - name: Deteksi artikel baru (file ditambahkan)
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IN='${{ github.event.inputs.path }}'
            if [ -n "$IN" ]; then
              FILES="$IN"
            else
              FILES="$(git log --diff-filter=A --name-only --pretty=format: -- content \
                       | grep -E '\.md$' | grep -v '_index.md' | head -1)"
            fi
          else
            BEFORE='${{ github.event.before }}'
            AFTER='${{ github.event.after }}'
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || true)"
            fi
            if [ -z "$BEFORE" ]; then
              FILES="$(git show --name-only --diff-filter=A --format= "$AFTER" -- content || true)"
            else
              FILES="$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- content || true)"
            fi
          fi
          echo "File baru di content/:"
          echo "$FILES"
          if [ -n "$(printf '%s' "$FILES" | tr -d '[:space:]')" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'files<<__EOF__'
            echo "$FILES"
            echo '__EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.detect.outputs.has == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # `requests` dipakai generate_drafts.py yang di-import untuk mencari foto
      # tambahan carousel (Pexels + verifikasi Gemini vision).
      - name: Install Pillow + requests
        if: steps.detect.outputs.has == 'true'
        run: pip install --quiet pillow requests

      # Non-blocking: gagal posting IG tidak boleh menggagalkan apa pun.
      #
      # DRY_RUN menentukan langkah ini menghitung PRATINJAU atau benar-benar posting:
      #   push ke main          -> DRY_RUN=1, hanya menyiapkan preview-<slug>.json
      #   workflow_dispatch     -> ikut input `posting` (default false = pratinjau)
      # Jadi tidak ada yang tayang di IG/FB tanpa disetujui lebih dulu di POS.
      - name: Pratinjau / posting ke Instagram
        id: post
        if: steps.detect.outputs.has == 'true'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: "112817513877801"   # Halaman centralcat_official (ID publik)
          SOCIAL_ANIMALS: "kucing,anjing" # medsos khusus 2 hewan ini; blog tetap semua hewan
          BASE_URL: "https://blog.centralcats.id/"
          NEW_FILES: ${{ steps.detect.outputs.files }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `aksi: tayangkan` setara dengan `posting: true` — dua-duanya diterima
          # supaya panel POS bisa memakai istilah tombolnya sendiri tanpa
          # memutus pemanggil lama.
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.posting == 'true' || github.event.inputs.aksi == 'tayangkan')) && '0' || '1' }}
          AKSI: ${{ github.event.inputs.aksi }}
          CAPTION_IG: ${{ github.event.inputs.caption_ig }}
          CAPTION_FB: ${{ github.event.inputs.caption_fb }}
          # Carousel: cari foto tambahan yang relevan (Pexels) & verifikasi tiap
          # kandidat lewat Gemini vision. GEMINI_API_KEY juga WAJIB ada karena
          # generate_drafts.py mengeceknya saat di-import (pola sama spt add-images.yml).
          CAROUSEL_MAX: "4"
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/post_instagram.py

      # Beri tahu admin bahwa ada pratinjau menunggu. Tanpa ini pratinjau terbentuk
      # diam-diam: panel Media Sosial di POS belum ada, jadi email satu-satunya
      # saluran yang benar-benar sampai. Skrip berhenti sendiri kalau tidak ada
      # pratinjau baru (mis. saat mode posting, atau artikel di luar SOCIAL_ANIMALS).
      - name: Email pratinjau medsos (Resend)
        if: steps.detect.outputs.has == 'true'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify_social_email.py

      # ── PENJAGA GAGAL SENYAP ─────────────────────────────────────────────────
      # Lahir dari kejadian NYATA 12 Agu 2026: run 31554609198 berstatus `success`
      # padahal post_instagram.py mati di ensure_release() dengan
      #   ssl.SSLCertVerificationError: CERTIFICATE_VERIFY_FAILED (self-signed certificate)
      # Akibatnya artikel `peluang-bisnis-playground-kucing` (kucing, ber-images,
      # draft=false — memenuhi semua syarat) TIDAK PERNAH punya pratinjau dan tidak
      # pernah tayang. Nol email, nol notifikasi, nol jejak: run hijau menutupinya.
      #
      # `continue-on-error: true` di atas SENGAJA DIPERTAHANKAN — supaya langkah
      # email pratinjau tetap jalan meski posting gagal. Yang ditambahkan di sini
      # cuma satu hal: membuat run BERWARNA MERAH ketika skripnya benar-benar mati,
      # supaya notifikasi kegagalan GitHub menyala.
      #
      # AMAN dari alarm palsu — sudah diverifikasi ke scripts/post_instagram.py:
      # SEMUA jalur wajar keluar dengan status 0, bukan exception:
      #   - aksi=tolak                       -> continue
      #   - artikel di luar SOCIAL_ANIMALS   -> continue   (tiap Sel/Kam/Jum!)
      #   - tidak ada artikel baru           -> return
      #   - Pillow / token / repo kosong     -> return
      # Jadi outcome == 'failure' HANYA terjadi saat ada exception tak tertangani.
      # Kalau kelak ada jalur wajar yang diubah jadi sys.exit(1)/raise, penjaga ini
      # WAJIB ditinjau ulang — alarm yang sering salah pasti dimatikan orang.
      #
      # Merah di sini tidak menggagalkan apa pun: workflow ini terpisah dari
      # hugo.yml (deploy situs) dan tak punya langkah lain sesudahnya.
      - name: Penjaga — jangan biarkan kegagalan lolos sebagai run hijau
        if: always() && steps.post.outcome == 'failure'
        run: |
          echo "::error title=Medsos GAGAL (bukan run hijau biasa)::scripts/post_instagram.py keluar dengan status GAGAL. Pratinjau kemungkinan TIDAK terbentuk dan artikel TIDAK tayang. Buka log langkah 'Pratinjau / posting ke Instagram' di run ini. Kalau penyebabnya transien (mis. SSL/jaringan), jalankan ulang workflow ini lewat Actions -> Run workflow dengan input path = artikel yang terlewat dan aksi = pratinjau."
          exit 1
